[project]
name = "vulnerabilidades-malaspracticasfrecuentes"
version = "0.1.0"
description = "Demo docente: la misma app Flask insegura y segura, para enseñar vulnerabilidades frecuentes."
readme = "README.md"
authors = [
    { name = "Navarro", email = "Navarrojuan212@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "psycopg[binary]>=3.2",
]

[tool.uv]
# No es un paquete instalable: es el entorno compartido por las dos apps y las pruebas.
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "pytest>=8.3",
]

[tool.ruff.lint]
# E, F: errores básicos · I: orden de imports · UP: sintaxis moderna
# B: bugs frecuentes (incluye V08) · S: reglas de seguridad (detectan varias Vxx)
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Las pruebas usan assert (S101), y arman peticiones de ataque a propósito.
"tests/**" = ["S101"]
