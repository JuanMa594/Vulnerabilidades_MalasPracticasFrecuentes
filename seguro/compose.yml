# App SEGURA. Funciona a la primera, sin .env:
#   rtk docker compose -f seguro/compose.yml up -d --build
# Todos los valores por defecto son de mentira (ver "Solo local, sin excepciones" en CLAUDE.md).
# Se pueden sobrescribir con variables de entorno o un .env, pero no hace falta.
name: vulns-seguro

services:
  web:
    build:
      # El contexto es la raíz del repo para poder copiar pyproject.toml y uv.lock.
      context: ..
      dockerfile: seguro/Dockerfile
    environment:
      HOST: "0.0.0.0"   # dentro del contenedor: la red interna de Docker, no la máquina
      PORT: "8000"
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-demo}
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clave_de_demo}
      # SEGURO V03: en producción esto vendría de un secreto real; aquí es falso.
      API_KEY_PASARELA: ${API_KEY_PASARELA:-sk-FALSO-pagos-9c8b7a6d5e4f3210}
    ports:
      # Puerto fijo 8012. Si estuviera ocupado: PUERTO_WEB=8032 docker compose ... up
      - "127.0.0.1:${PUERTO_WEB:-8012}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demo}
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clave_de_demo}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Postgres 18 guarda los datos en un subdirectorio: se monta en /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo} -d ${POSTGRES_DB:-demo}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Sin `ports`: a Postgres solo se llega desde la red interna de Docker.

  pgadmin:
    image: dpage/pgadmin4:9.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ferreteria.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_de_demo}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # Puerto fijo 5052. Si estuviera ocupado: PUERTO_PGADMIN=5072 docker compose ... up
      - "127.0.0.1:${PUERTO_PGADMIN:-5052}:80"
    depends_on:
      - db

volumes:
  db-data:
